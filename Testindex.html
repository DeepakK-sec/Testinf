<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deepak | Trust & Safety + SOC Analyst</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      line-height: 1.6;
      padding-top: 2rem;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 6rem;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: #fff;
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    .hero {
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .name {
      font-size: 5.5rem;
      font-weight: bold;
      margin-bottom: 1.2rem;
      letter-spacing: 3px;
    }

    .tagline {
      font-size: 1.3rem;
      margin-bottom: 3rem;
      letter-spacing: 4px;
      opacity: 0.9;
    }

    .skills {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1.1rem;
      margin-top: 2.5rem;
    }

    .skill {
      background: rgba(30, 30, 30, 0.7);
      padding: 0.55rem 1.2rem;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    @media (max-width: 700px) {
      .name { font-size: 3.8rem; }
      .tagline { font-size: 1.1rem; letter-spacing: 2px; }
      nav { gap: 1.2rem; font-size: 0.85rem; }
    }

    @media (max-width: 480px) {
      .name { font-size: 2.8rem; }
      nav { flex-wrap: wrap; gap: 0.8rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="#about">ABOUT</a>
    <a href="#experience">EXPERIENCE</a>
    <a href="#skills">SKILLS</a>
    <a href="#contact">CONTACT</a>
  </nav>

  <div class="hero">
    <div class="name">DEEPAK</div>
    <div class="tagline">TRUST & SAFETY SPECIALIST | CLOUD SECURITY | SOC ANALYST</div>

    <div class="skills" id="skills">
      <!-- Trust & Safety -->
      <span class="skill">ABUSE DETECTION</span>
      <span class="skill">AWS POLICY ENFORCEMENT</span>
      <span class="skill">FRAUD ANALYSIS</span>
      <span class="skill">CONTENT MODERATION</span>
      <span class="skill">ATO PREVENTION</span>

      <!-- SOC / Security -->
      <span class="skill">AWS SECURITY HUB</span>
      <span class="skill">GUARDDUTY</span>
      <span class="skill">SPLUNK</span>
      <span class="skill">MITRE ATT&CK</span>
      <span class="skill">INCIDENT RESPONSE</span>
      <span class="skill">CLOUDTRAIL ANALYSIS</span>
      <span class="skill">PYTHON SCRIPTING</span>
    </div>
  </div>

</body>
</html>
